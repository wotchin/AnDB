name: Kernel recovery regression

on:
  push:
    branches: ['fix/kernel-recovery-acid-20261016']
  pull_request:
    branches: ['kernel-wip']

permissions:
  contents: read

jobs:
  kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt pytest-timeout
      - name: Run unit and crash-recovery tests
        run: python -m pytest tests -ra --timeout=120 --junitxml=/tmp/kernel-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-test-results-${{ matrix.python-version }}
          path: /tmp/kernel-tests.xml
          if-no-files-found: ignore
          retention-days: 14
